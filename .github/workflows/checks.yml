name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './mcp-server[dev]'
      - name: Run focused checks
        shell: pwsh
        run: >-
          python -m pytest
          mcp-server/tests/test_js_suite.py
          mcp-server/tests/test_admin_js_sintaxis.py
          mcp-server/tests/test_admin_css_build.py
          mcp-server/tests/test_chat_mobile.py
          mcp-server/tests/test_panel_plan.py
          mcp-server/tests/test_conversations_ui.py
          mcp-server/tests/test_memories_ui.py
          mcp-server/tests/test_identity.py
          mcp-server/tests/test_browser_boundary.py
          mcp-server/tests/test_system_config.py
          mcp-server/tests/test_expert_timeout_endpoint.py
          mcp-server/tests/test_tool_timeout.py
          mcp-server/tests/test_db.py
          mcp-server/tests/test_ui_contrato_experts_run.py
          -q
