name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './mcp-server[dev]'
      - name: Run focused checks
        shell: pwsh
        run: >-
          python -m pytest
          mcp-server/tests/test_js_suite.py
          mcp-server/tests/test_admin_js_sintaxis.py
          mcp-server/tests/test_admin_css_build.py
          mcp-server/tests/test_chat_mobile.py
          mcp-server/tests/test_panel_plan.py
          mcp-server/tests/test_conversations_ui.py
          mcp-server/tests/test_memories_ui.py
          mcp-server/tests/test_identity.py
          mcp-server/tests/test_active_actor.py
          mcp-server/tests/test_github_actor.py
          mcp-server/tests/test_github_mcp_token.py
          mcp-server/tests/test_google_tools.py
          mcp-server/tests/test_roundtrip.py
          mcp-server/tests/test_team_access.py
          mcp-server/tests/test_team_users_db.py
          mcp-server/tests/test_user_accounts.py
          mcp-server/tests/test_native_auth.py
          mcp-server/tests/test_user_mail.py
          mcp-server/tests/test_project_code_permissions.py
          mcp-server/tests/test_project_privacy.py
          mcp-server/tests/test_task_persistence.py
          mcp-server/tests/test_task_workspace.py
          mcp-server/tests/test_task_pr.py
          mcp-server/tests/test_task_controls.py
          mcp-server/tests/test_task_continuity.py
          mcp-server/tests/test_task_callers.py
          mcp-server/tests/test_task_index.py
          mcp-server/tests/test_execution_integrity.py
          mcp-server/tests/test_progress.py
          mcp-server/tests/test_module_boundaries.py
          mcp-server/tests/test_model_request_guard.py
          mcp-server/tests/test_notify_progress.py
          mcp-server/tests/test_notify_descartes.py
          mcp-server/tests/test_skills.py
          mcp-server/tests/test_ask_human_evidencia.py
          mcp-server/tests/test_tracing.py
          mcp-server/tests/test_browser_boundary.py
          mcp-server/tests/test_system_config.py
          mcp-server/tests/test_expert_timeout_endpoint.py
          mcp-server/tests/test_tool_timeout.py
          mcp-server/tests/test_db.py
          mcp-server/tests/test_ui_contrato_experts_run.py
          -q
      - name: Check focused orchestrator autosplit and cancellation
        shell: pwsh
        run: >-
          python -m pytest
          mcp-server/tests/test_orquestador.py
          -k "split or subdiv or fan_out or flag_apagado or subtarea or cancel or claim or salir_por_la_mala or parar or decision or reintentar or contestar or darla_por_fallada or responder or texto_libre"
          -q
      - name: Check graph interruption and repeated requests
        shell: pwsh
        run: >-
          python -m pytest
          mcp-server/tests/test_disparador.py
          mcp-server/tests/test_graph_cancel.py
          mcp-server/tests/test_graphs_create_dup_guard.py
          mcp-server/tests/test_planificador.py
          -q
      - name: Check legacy contracts and process cleanup
        shell: pwsh
        run: >-
          python -m pytest
          mcp-server/tests/test_git_actions.py
          mcp-server/tests/test_night.py::TestBranchWorker
          mcp-server/tests/test_conversations.py::TestConversationsDb
          mcp-server/tests/test_files.py
          mcp-server/tests/test_shell_integrity.py
          mcp-server/tests/test_shell_y_preguntas.py::test_cancelar_desde_afuera_tambien_mata_el_arbol
          mcp-server/tests/test_shell_y_preguntas.py::test_background_vuelve_enseguida_y_el_proceso_queda_vivo
          mcp-server/tests/test_shell_y_preguntas.py::test_el_comando_con_ruta_windows_corre
          -q
